name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          sdkmanager --list_installed

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Add Rust Android target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-linux-android

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v || true
          rustup target list --installed

      - name: Resolve Dart dependencies and l10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Generate Freezed/Riverpod/FlutterGen code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build foliate-js assets
        run: |
          npm ci --prefix assets/foliate-js
          (cd assets/foliate-js && node node_modules/webpack-cli/bin/cli.js --config webpack.config.js)

      - name: Configure signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -alias modu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass modu123456 -keypass modu123456 \
            -dname "CN=Modu, O=Modu, C=CN"
          cat > android/key.properties <<EOF
          storePassword=modu123456
          keyPassword=modu123456
          keyAlias=modu
          storeFile=release.jks
          EOF

      - name: Use accessible Gradle mirror
        shell: bash
        run: |
          set -euo pipefail
          HOST="mirrors.huaweicloud.com"
          if ! curl -fsIL --retry 2 --connect-timeout 15 \
            "https://$HOST/gradle/gradle-9.2.1-bin.zip" >/dev/null; then
            HOST="mirrors.cloud.tencent.com"
          fi
          echo "Gradle distribution host: $HOST"
          sed -i \
            -e "s#mirrors.huaweicloud.com#$HOST#" \
            -e "s#mirrors.cloud.tencent.com#$HOST#" \
            -e "s#services.gradle.org#$HOST#" \
            android/gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build arm64 release APK
        run: |
          set -o pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: modu-arm64-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
